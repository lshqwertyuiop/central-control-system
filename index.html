<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>型材立库中控系统</title>
  <link rel="stylesheet" href="antd.min.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f6fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    /* ── Sider / Header ── */
    .sider-logo {
      display: flex; align-items: center; gap: 9px;
      padding: 0 18px; height: 52px; border-bottom: 1px solid #f0f0f0;
      background: #fff; flex-shrink: 0; overflow: hidden;
    }
    .sider-logo-icon {
      width: 28px; height: 28px; border-radius: 6px;
      background: #E85B00; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .sider-logo-icon span { color: #fff; font-weight: 900; font-size: 15px; line-height:1; }
    .sider-logo-text { font-weight: 700; font-size: 13px; color: #1a1a2e; white-space: nowrap; letter-spacing: .4px; }
    .sider-logo-text small { font-weight: 400; font-size: 11px; color: #999; display:block; line-height:1.2; }

    .header-bar {
      background: #fff; padding: 0 20px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #f0f0f0; height: 52px; flex-shrink: 0;
    }

    /* ── Warehouse Grid ── */
    .wh-outer { display: flex; gap: 16px; align-items: flex-start; }
    .wh-wrap  { overflow: auto; flex: 1; padding: 4px 0; }
    .wh-areas { display: flex; gap: 16px; align-items: flex-start; width: max-content; }
    .wh-area-card {
      border: 1px solid #eceff3; border-radius: 12px; padding: 14px;
      background: #fff;
      box-shadow: 0 1px 3px rgba(20, 40, 80, .04);
    }
    .wh-area-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 12px; margin-bottom: 10px;
    }
    .wh-area-title { font-size: 14px; font-weight: 700; color: #1a1a2e; }
    .wh-area-meta { font-size: 12px; color: #8c8c8c; }
    .wh-axis { display: flex; align-items: center; margin-bottom: 6px; }
    .wh-axis-spacer { width: 44px; flex-shrink: 0; }
    .wh-axis-cols { display: flex; gap: 4px; padding-left: 2px; }
    .wh-axis-label {
      width: 36px; text-align: center; font-size: 11px;
      color: #8c8c8c; flex-shrink: 0;
    }
    .wh-grid  { display: flex; flex-direction: column; gap: 4px; width: max-content; }
    .wh-row   { display: flex; align-items: center; gap: 4px; }
    .wh-row-label {
      width: 44px; text-align: left; padding-left: 6px;
      font-size: 11px; color: #8c8c8c; flex-shrink: 0;
    }
    .wh-row-cells {
      display: flex; gap: 6px; padding: 4px 0;
    }
    .wh-cell {
      width: 34px; height: 24px; border-radius: 6px; cursor: pointer;
      border: 1px solid #eef1f5; background: #f6f8fb;
      transition: transform .12s, box-shadow .12s, background .12s;
      position: relative; display: flex; align-items: center; justify-content: center;
    }
    .wh-cell-slot {
      width: 34px; height: 24px; flex-shrink: 0;
      pointer-events: none;
    }
    .wh-cell::after { content:''; width:8px; height:8px; border-radius:50%; background:transparent; }
    .wh-cell:hover { transform: translateY(-1px); z-index: 10; box-shadow: 0 2px 6px rgba(0,0,0,.10); }

    .s-empty    { background: #fff; }
    .s-empty::after    { background:#fff; border:1.5px solid #d0d5dd; }
    .s-occupied { background: rgba(22,119,255,.08); border-color: rgba(22,119,255,.18); }
    .s-occupied::after { background:#1677ff; }
    .s-abnormal { background: rgba(255,77,79,.10); border-color: rgba(255,77,79,.22); }
    .s-abnormal::after { background:#ff4d4f; }
    .s-locked   { background: rgba(250,173,20,.12); border-color: rgba(250,173,20,.28); }
    .s-locked::after   { background:#faad14; }
    .s-disabled { background: #f0f0f0; border-color:#e3e3e3; }
    .s-disabled::after { background:#cfcfcf; }
    .s-selected { border-color: #E85B00 !important;
                  box-shadow: 0 0 0 2px rgba(232,91,0,.25) !important; }
    .s-dimmed   { opacity: .25; }
    @keyframes cellPulse { 0%,100%{opacity:1} 50%{opacity:.55} }

    /* ── Legend (vertical, right side) ── */
    .wh-legend {
      display: flex; flex-direction: column; gap: 10px;
      padding: 10px 12px; background: #fafafa;
      border: 1px solid #f0f0f0; border-radius: 6px;
      flex-shrink: 0; align-self: flex-start;
    }
    .legend-item { display:flex; align-items:center; gap:8px; font-size:12px; color:#555; white-space:nowrap; }
    .legend-dot  { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
    .legend-dot.ld-empty    { background:#fff; border:1.5px solid #d0d5dd; }
    .legend-dot.ld-occupied { background:#1677ff; }
    .legend-dot.ld-abnormal { background:#ff4d4f; }
    .legend-dot.ld-locked   { background:#faad14; }
    .legend-dot.ld-disabled { background:#d9d9d9; }

    /* ── Layout tweaks ── */
    .page-content { padding: 16px; min-height: 100%; }
    .stat-card { text-align: center; }
    .conn-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }
    .conn-ok  { background:#52c41a; }
    .conn-err { background:#ff4d4f; animation:cellPulse 1s infinite; }
    .section-gap { margin-bottom: 14px; }

    /* ── 加工任务 实时看板 ── */
    .kb-mat-id { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-weight: 700; font-size: 12px; color: #111827; }
    .kb-badge {
      display: inline-flex; align-items: center; border-radius: 5px;
      padding: 1px 9px; font-size: 12px; font-weight: 600;
      border: 1px solid #e5e7eb; background: #f3f4f6; color: #374151; line-height: 20px;
    }
    .kb-badge-editable { cursor: pointer; border-color: #91caff; background: #eff6ff; color: #1677ff; transition: background .15s; }
    .kb-badge-editable:hover { background: #dbeafe; }
    .kb-badge-loading { border-style: dashed; border-color: #a5b4fc; color: #6366f1; background: #f5f3ff; }
    .kb-badge-old { text-decoration: line-through; color: #9ca3af; background: #f3f4f6; font-size: 11px; }
    .kb-legend { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    .kb-legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #8c8c8c; }
    .kb-legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .kb-live-dot { width: 8px; height: 8px; border-radius: 50%; background: #52c41a; animation: cellPulse 1.6s infinite; flex-shrink: 0; }
    .kb-table .kb-row-pushfail > td { background: #fff1f0 !important; }
    .kb-drag-handle { cursor: grab; color:#bfbfbf; font-size:16px; line-height:1; user-select:none; display:inline-block; padding:0 2px; }
    .kb-drag-handle:hover { color:#fa8c16; }
    .kb-drag-handle:active { cursor: grabbing; }
    .kb-table .kb-row-dragover > td { border-top: 2px solid #fa8c16 !important; background:#fff7e6; }
    /* 加工任务列表固定高度：任务较少时也保持一致的可视区域 */
    .kb-table .ant-table-body { height: 520px !important; max-height: 520px !important; }
    /* 加工任务双视图：切换器固定在统一页头，避免列表与队列视图的入口位置、留白不一致。 */
    .kb-view-header { min-height:48px; margin-bottom:12px; padding:0 14px; display:flex; align-items:center; justify-content:space-between; gap:12px; background:#fff; border:1px solid #f0f0f0; border-radius:6px; }
    .kb-view-title { font-size:15px; font-weight:600; color:#262626; }
    .kb-view-switch .ant-radio-button-wrapper { min-width:76px; text-align:center; }
    @media(max-width:560px){ .kb-view-header{padding:10px 12px; align-items:flex-start; flex-direction:column;} }
    /* 两个模式的内容标题、页签使用相同的视觉规格。 */
    .kb-mode-card > .ant-card-head { min-height:44px; padding:0 14px; }
    .kb-mode-card > .ant-card-head .ant-card-head-title { font-size:14px; font-weight:600; }
    .kb-mode-card .ant-tabs-nav { margin-bottom:12px; }
    .kb-mode-card .ant-tabs-tab { padding:11px 0; font-size:13px; }
    .sched-gantt { border:1px solid #f0f0f0; border-radius:6px; background:#fafbfc; padding:6px 4px; }
    /* ── 新建排产：原生上下工作台（由排产仿真页面迁入，不再依赖 iframe） ── */
    .ns-page { padding:16px 16px 72px; }
    .ns-top { min-height:650px; margin-bottom:14px; border-color:#f0f0f0; border-radius:6px; }
    .ns-top > .ant-card-body { min-height:648px; padding:0 14px 14px; display:grid; grid-template-columns:560px minmax(0,1fr); grid-template-rows:1fr auto; gap:0; }
    .ns-task { min-width:0; padding-right:14px; display:flex; flex-direction:column; border-right:1px solid #f0f0f0; }
    .ns-route { min-width:0; padding-left:14px; }
    .ns-panel-head { min-height:48px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0; margin-bottom:12px; border-bottom:1px solid #f0f0f0; }
    .ns-panel-title { display:flex; align-items:center; gap:10px; min-width:0; font-size:14px; line-height:22px; font-weight:600; color:#262626; }
    .ns-panel-sub { margin-left:0; overflow:hidden; color:#8c8c8c; font-size:12px; line-height:20px; font-weight:400; text-overflow:ellipsis; white-space:nowrap; }
    .ns-task-table { flex:1; min-height:0; }
    .ns-task-table .ant-table { font-size:12px; }
    .ns-task-table .ant-table-cell { padding:8px 10px!important; }
    .ns-task-table .ant-table-thead > tr > th { color:#262626; font-weight:600; background:#fafafa; }
    .ns-task-table .ant-pagination { margin:14px 0 0; }
    .ns-top-actions { grid-column:1 / -1; display:flex; justify-content:flex-end; gap:10px; padding-top:12px; margin-top:12px; border-top:1px solid #f0f0f0; }
    .ns-mode-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 12px; margin-bottom:12px; border:1px solid #f0f0f0; border-radius:6px; background:#fafafa; }
    .ns-mode-row strong { font-size:13px; font-weight:600; }
    .ns-mode-note { flex-basis:100%; color:#8c8c8c; font-size:12px; line-height:20px; }
    .ns-chip-group { display:flex; gap:7px; flex-wrap:wrap; }
    .ns-chip { min-height:30px!important; height:30px; padding:0 13px!important; border-radius:16px!important; font-size:12px; }
    .ns-chip.on { color:#fff!important; background:#35bd18!important; border-color:#35bd18!important; }
    .ns-chip.off { color:#a6a6a6!important; background:#f7f7f7!important; border-color:#d9d9d9!important; text-decoration:line-through; }
    .ns-config-controls { display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:10px 12px; margin-bottom:12px; border:1px solid #f0f0f0; border-radius:6px; background:#fafafa; }
    .ns-device-row { display:flex; gap:28px; flex-wrap:wrap; margin-bottom:10px; }
    .ns-device-block { min-width:145px; }
    .ns-label { margin-bottom:6px; color:#595959; font-size:12px; line-height:20px; }
    .ns-routes { margin-bottom:12px; }
    .ns-topology { position:relative; height:250px; overflow:hidden; border:1px solid #e5e7eb; border-radius:7px; background:linear-gradient(90deg,#fafafa 0 24%,#fff 24% 76%,#fafafa 76%); }
    .ns-topology svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
    .ns-topology path { fill:none; stroke:#35bd18; stroke-width:5; stroke-linecap:round; }
    .ns-topology path.off { stroke:#dedede; stroke-dasharray:9 8; }
    .ns-zone { position:absolute; top:12px; color:#8c8c8c; font-size:12px; font-weight:600; }
    .ns-zone.out { left:3%; } .ns-zone.spray { left:46%; transform:translateX(-50%); } .ns-zone.cut { right:3%; }
    .ns-station { position:absolute; z-index:2; width:68px; min-height:30px; display:flex; align-items:center; gap:7px; padding:5px 8px; border:1px solid #d9d9d9; border-left:4px solid #35bd18; border-radius:6px; background:#fff; transform:translate(-50%,-50%); font-size:12px; }
    .ns-station.spray { border-left-color:#722ed1; } .ns-station.emergency { border-left-color:#fa8c16; }
    .ns-station.disabled { opacity:.46; border-style:dashed; }
    .ns-station i { width:7px; height:7px; border-radius:50%; background:#35bd18; }
    .ns-station.disabled i { background:#d9d9d9; }
    .ns-section-card { margin-bottom:14px; border-color:#f0f0f0; border-radius:6px; }
    .ns-section-card > .ant-card-head { min-height:44px; padding:0 16px; }
    .ns-section-card > .ant-card-head .ant-card-head-title { padding:11px 0; color:#262626; font-size:14px; line-height:22px; font-weight:600; }
    .ns-section-card > .ant-card-head .ant-card-extra { padding:9px 0; }
    .ns-section-card > .ant-card-body { padding:14px 16px; }
    .ns-assign-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .ns-machine-col { min-height:132px; border:1px solid #e5e7eb; border-radius:7px; overflow:hidden; background:#fafafa; }
    .ns-machine-head { display:flex; justify-content:space-between; padding:9px 11px; border-bottom:1px solid #e5e7eb; background:#fff; font-size:13px; font-weight:600; }
    .ns-order-item { display:flex; justify-content:space-between; gap:8px; margin:7px; padding:7px 9px; border:1px solid #e5e7eb; border-radius:5px; background:#fff; cursor:grab; font-size:12px; }
    .ns-order-item:active { cursor:grabbing; }
    .ns-profile-scheduled > td { color:#bfbfbf!important; background:#fafafa!important; }
    .ns-metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px; }
    .ns-metrics > .ant-card { border-color:#f0f0f0; border-radius:6px; }
    .ns-metrics > .ant-card > .ant-card-body { padding:10px 16px; }
    .ns-gantt { overflow-x:auto; padding:10px 8px; border:1px solid #f0f0f0; border-radius:6px; background:#fafbfc; }
    .ns-gantt-row { min-width:900px; display:grid; grid-template-columns:38px 1fr; align-items:center; gap:8px; margin:10px 0; }
    .ns-gantt-label { font-weight:700; font-size:13px; }
    .ns-gantt-track { height:22px; display:flex; overflow:hidden; background:#f0f0f0; }
    .ns-gantt-seg { height:100%; border-right:1px solid rgba(255,255,255,.4); }
    .ns-gantt-legend { display:flex; gap:13px; flex-wrap:wrap; margin-top:10px; padding:8px 10px; border-radius:6px; background:#f5f6fa; font-size:12px; }
    .ns-gantt-legend i { display:inline-block; width:11px; height:11px; margin-right:5px; border-radius:3px; vertical-align:-1px; }
    .ns-expanded-heading { min-height:40px; display:flex; align-items:center; justify-content:space-between; gap:12px; color:#262626; font-size:14px; font-weight:600; }
    .ns-expanded-heading + .ant-table-wrapper,
    .ns-expanded-heading + .ant-row { margin-top:0; }
    .ns-expanded-heading.is-secondary { margin-top:14px; border-top:1px solid #f0f0f0; }
    .ns-native-footer { position:sticky; z-index:20; bottom:0; display:flex; align-items:center; gap:10px; margin-top:0; padding:12px 16px; border:1px solid #f0f0f0; border-radius:6px; background:#fff; box-shadow:0 -4px 16px rgba(0,0,0,.06); font-size:13px; }
    .ns-picker-modal .ant-modal-title { color:#262626; font-size:16px; font-weight:600; }
    .ns-picker-modal .ant-modal-header { margin-bottom:0; padding-bottom:14px; border-bottom:1px solid #f0f0f0; }
    .ns-picker-modal .ant-modal-body { padding-top:14px; }
    .ns-picker-modal .ant-table { font-size:12px; }
    .ns-picker-modal .ant-table-thead > tr > th { color:#262626; font-weight:600; background:#fafafa; }
    @media(max-width:1180px){ .ns-top > .ant-card-body{grid-template-columns:440px minmax(0,1fr);} }
    @media(max-width:900px){ .ns-top > .ant-card-body{display:block;} .ns-task{padding:0 0 14px;border:0;border-bottom:1px solid #f0f0f0;} .ns-route{padding:14px 0 0;} .ns-assign-grid,.ns-metrics{grid-template-columns:1fr;} }
    .kb-prog { display:flex; flex-direction:column; gap:3px; }
    .kb-prog-bar { display:flex; gap:3px; }
    .kb-prog-seg { width:14px; height:6px; border-radius:3px; background:#e5e7eb; display:inline-block; }
    .kb-prog-done { background:#52c41a; }
    .kb-prog-cur  { background:#1677ff; box-shadow:0 0 0 2px rgba(22,119,255,.18); animation:cellPulse 1.6s infinite; }
    .kb-prog-pend { background:#e5e7eb; }
    .kb-prog-failed { background:#ff4d4f; box-shadow:0 0 0 2px rgba(255,77,79,.14); }
    .kb-prog-cur-plan, .kb-prog-cur-migrate { background:#1677ff; box-shadow:0 0 0 2px rgba(22,119,255,.18); }
    .plan-prog .kb-prog-seg { width:24px; }
    .kb-prog-label { font-size:11px; color:#6b7280; white-space:nowrap; }
    .kbq-wrap { margin-top:0; border-color:#f0f0f0; }
    .kbq-wrap > .ant-card-head { min-height:44px; padding:0 14px; }
    .kbq-wrap > .ant-card-head .ant-card-head-title { font-size:14px; font-weight:600; }
    .kbq-wrap > .ant-card-body { padding:0 14px 14px; }
    .kbq-wrap .ant-tabs-nav { margin-bottom:12px; }
    .kbq-wrap .ant-tabs-tab { padding:11px 0; font-size:13px; }
    .kbq-section-title { font-size:14px; font-weight:700; color:#1f2937; margin-bottom:9px; }
    .kbq-outlets { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .kbq-panel { border-color:#f0f0f0!important; background:#fff; min-width:0; overflow:hidden; }
    .kbq-panel > .ant-card-head { min-height:40px; padding:0 12px; background:#fafafa; }
    .kbq-panel > .ant-card-head .ant-card-head-title { padding:9px 0; font-size:13px; font-weight:600; }
    .kbq-panel > .ant-card-head .ant-card-extra { padding:7px 0; }
    .kbq-panel > .ant-card-body { padding:0; }
    .kbq-panel-head { min-height:42px; padding:8px 11px; display:flex; align-items:center; justify-content:space-between; gap:10px; border-bottom:1px solid #eef0f2; }
    .kbq-panel-title { font-size:13px; font-weight:700; }
    .kbq-outlet-body { padding:9px; min-height:74px; display:flex; flex-direction:column; gap:7px; background:#fafafa; }
    .kbq-outlet-item { width:100%; display:flex; align-items:center; gap:5px; padding:5px 7px; border:1px solid #d9e2ec; background:#f8fafc; cursor:grab; }
    .kbq-outlet-item.is-called { cursor:default; background:#faf7ff; border-color:#d3adf7; }
    .kbq-outlet-item.is-running { cursor:default; background:#f0f7ff; border-color:#91caff; border-left:3px solid #1677ff; }
    .kbq-outlet-item.is-selected { border-color:#e85b00; background:#fff7e6; box-shadow:0 0 0 2px rgba(232,91,0,.12); }
    .kbq-outlet-item.is-dragover { border-top:2px solid #e85b00; }
    .kbq-outlet-task { flex:1; min-width:0; padding:0 3px!important; height:24px!important; border:0!important; background:transparent!important; box-shadow:none!important; font:600 11px Consolas,monospace!important; text-align:left!important; justify-content:flex-start!important; }
    .kbq-drag { color:#9ca3af; font-size:14px; line-height:1; }
    .kbq-gantt { border:1px solid #e5e7eb; background:#fff; overflow-x:auto; }
    .kbq-scale, .kbq-lane { display:grid; grid-template-columns:190px minmax(760px,1fr); min-width:950px; }
    .kbq-scale { border-bottom:1px solid #e5e7eb; background:#fafafa; }
    .kbq-scale-label { padding:8px 11px; font-size:12px; color:#6b7280; border-right:1px solid #e5e7eb; }
    .kbq-scale-track { display:grid; grid-template-columns:repeat(5,1fr); font-size:11px; color:#8c8c8c; align-items:center; }
    .kbq-scale-track span { padding-left:6px; border-left:1px solid #e5e7eb; }
    .kbq-lane + .kbq-lane { border-top:1px solid #e5e7eb; }
    .kbq-lane-meta { padding:9px 11px; border-right:1px solid #e5e7eb; background:#fff; }
    .kbq-lane-name { display:flex; align-items:center; justify-content:space-between; gap:6px; font-size:13px; font-weight:700; }
    .kbq-lane-time { margin-top:5px; font-size:11px; line-height:1.55; color:#6b7280; }
    .kbq-track { display:flex; align-items:center; min-height:76px; padding:10px 8px; gap:3px; background:repeating-linear-gradient(to right,#fff 0,#fff calc(20% - 1px),#eef0f2 calc(20% - 1px),#eef0f2 20%); }
    .kbq-busy { height:34px; min-width:22px; background:#d1d5db; color:#4b5563; display:flex; align-items:center; justify-content:center; font-size:10px; overflow:hidden; }
    .kbq-block { height:34px; min-width:42px; border:1px solid #91caff; background:#e6f4ff; color:#0958d9; display:flex; align-items:center; justify-content:center; padding:0 5px; font:600 10px Consolas,monospace; cursor:pointer; overflow:hidden; white-space:nowrap; transition:.15s; }
    .kbq-block:hover { background:#bae0ff; border-color:#1677ff; transform:translateY(-1px); }

    .kbq-group-card { position:relative; padding:13px 16px 13px 30px; border-color:#dbe3eb; border-radius:5px; box-shadow:0 3px 14px rgba(57,80,105,.05); }

<script>

const { useState, useEffect, useMemo, useCallback, useRef } = React;
const {
  Layout, Menu, Table, Button, Tag, Form, Select, Input,
  Space, Card, Row, Col, Badge, Modal, Tooltip, Divider,

const STATUS_CFG = {
  empty:   {label:'空货位', cls:'ld-empty',    bg:'#fff'},
  occupied:{label:'有货',   cls:'ld-occupied', bg:'#1677ff'},
  abnormal:{label:'异常',   cls:'ld-abnormal', bg:'#ff4d4f'},
  disabled:{label:'禁用',   cls:'ld-disabled', bg:'#d9d9d9'},

const CellTooltip = ({cell}) => React.createElement('div', {style:{fontSize:12}},
  React.createElement('div', null, `库位: ${cell.binNo}`),
  React.createElement('div', null, `目标库位: ${cell.targetBinNo||'待分配'}`),
  React.createElement('div', null, `分区: ${cell.areaName}`),
  cell.profileType && React.createElement('div', null, `规格: ${cell.profileType}`),
  cell.material && React.createElement('div', null, `材质: ${cell.material}`),

);

const WarehouseGrid = ({data, selected, onSelect, matchBins}) => {
  const hasFilter = matchBins && matchBins.size > 0;
  const legend = React.createElement('div', {className:'wh-legend'},
    Object.entries(STATUS_CFG).map(([k,v]) =>
      React.createElement('div', {key:k, className:'legend-item'},
        React.createElement('div', {className:`legend-dot ${v.cls}`}),
        React.createElement('span', null, v.label),
      )
    )
  );
  const grid = React.createElement('div', {className:'wh-wrap'},
    React.createElement('div', {className:'wh-areas'},
      data.map((area)=>
        React.createElement('div',{key:area.key,className:'wh-area-card'},
          React.createElement('div',{className:'wh-area-head'},
            React.createElement('div',{className:'wh-area-title'},area.name),
            React.createElement('div',{className:'wh-area-meta'},`${area.totalBins} 库位`)
          ),
          React.createElement('div',{className:'wh-axis'},
            React.createElement('div',{className:'wh-axis-spacer'}),
            React.createElement('div',{className:'wh-axis-cols'},
              area.colLabels.map((label)=>
                React.createElement('div',{key:label,className:'wh-axis-label'},label)
              )
            )
          ),
          React.createElement('div', {className:'wh-grid'},
            area.rows.map((row,ri)=>
              React.createElement('div',{key:`${area.key}-${ri}`,className:'wh-row'},
                React.createElement('div',{className:'wh-row-label'},`第${area.levels - ri}层`),
                React.createElement('div',{className:'wh-row-cells'},
                  row.map((cell,ci)=>{
                    if (!cell) {
                      return React.createElement('div', {
                        key:ci,
                        className:'wh-cell-slot',
                      });
                    }
                    const isSel = selected?.id === cell.id;
                    const isDimmed = hasFilter && !matchBins.has(cell.binNo) && !isSel;
                    let cls = `wh-cell s-${cell.status}`;
                    if (isSel) cls += ' s-selected';
                    if (isDimmed) cls += ' s-dimmed';
                    return React.createElement(Tooltip, {
                      key:ci,
                      title: React.createElement(CellTooltip, {cell}),
                      placement:'top',
                      mouseEnterDelay:0.1,
                    },
                      React.createElement('div', {
                        className: cls,
                        onClick: () => onSelect(cell),
                      })
                    );
                  })
                )
              )
            )
          )
        )
      )
    )
  );
  return React.createElement('div', {className:'wh-outer'}, grid, legend);
};

const InventoryDashboard = ({gridData, inventoryData}) => {
  const [selected, setSelected] = useState(null);
  const [matchBins, setMatchBins] = useState(new Set());
  const [filteredData, setFilteredData] = useState(inventoryData);
  const [tableData, setTableData] = useState(inventoryData);
  const [activeAreaKey, setActiveAreaKey] = useState(null);
  const [form] = Form.useForm();
  const [editOpen, setEditOpen] = useState(false);
  const [editRow, setEditRow] = useState(null);
  const [editFormData, setEditFormData] = useState({});
  const {message:msg} = App.useApp();

  const allCells = useMemo(()=>flattenWarehouseAreas(gridData),[gridData]);
  const visibleAreas = useMemo(
    ()=> activeAreaKey ? gridData.filter(area => area.key === activeAreaKey) : gridData,
    [gridData, activeAreaKey]
  );
  const stats = useMemo(()=>({
    total: allCells.length,
    occupied: allCells.filter(c=>c.status==='occupied').length,
    empty: allCells.filter(c=>c.status==='empty').length,
    locked: allCells.filter(c=>c.status==='locked').length,
    abnormal: allCells.filter(c=>c.status==='abnormal').length,
    disabled: allCells.filter(c=>c.status==='disabled').length,
    inUse: allCells.filter(c=>['occupied','locked','abnormal'].includes(c.status)).length,
  }),[allCells]);

  const handleCellClick = (cell) => {
    if (selected?.id === cell.id) {
      setSelected(null);
      setTableData(filteredData);
    } else {
      setSelected(cell);
      setTableData(filteredData.filter(r=>r.binNo===cell.binNo));
    }
  };

  const handleSearch = () => {
    const v = form.getFieldsValue();
    let res = inventoryData;
    if (v.areaKey)     res = res.filter(r=>r.areaKey===v.areaKey);
    if (v.profileType) res = res.filter(r=>r.profileType===v.profileType);
    if (v.material)    res = res.filter(r=>r.material===v.material);
    if (v.shipNo)      res = res.filter(r=>r.shipNo===v.shipNo);
    if (v.blockNo)     res = res.filter(r=>r.blockNo===v.blockNo);
    setFilteredData(res);
    setTableData(res);
    setMatchBins(new Set(res.map(r=>r.binNo)));
    setActiveAreaKey(v.areaKey || null);
    setSelected(null);
  };

  const handleReset = () => {
    form.resetFields();
    setFilteredData(inventoryData);
    setTableData(inventoryData);
    setMatchBins(new Set());
    setActiveAreaKey(null);
    setSelected(null);
  };

  const EDIT_FIELDS = [
    ['库位编码','binNo'],['型材编码','profileId'],['船号','shipNo'],
    ['分段号','blockNo'],['材质','material'],['规格','profileType'],
    ['版图号','nestingLayoutNo'],['长度(mm)','length'],
    ['重量(kg)','weight'],['炉批号','heatNumber'],['计划日期','planDate'],
  ];

  const canEditBin = (status) => ['occupied','empty'].includes(status);

  const openEditModal = (row) => {
    const initialData = {};
    EDIT_FIELDS.forEach(([_, fieldName]) => {
      initialData[fieldName] = row[fieldName] || '';
    });
    initialData.reason = '';
    setEditRow(row);
    setEditFormData(initialData);
    setEditOpen(true);
  };

  const handleEditSave = () => {
    msg.success(`库位 ${editRow.binNo} 修改成功`);
    setEditOpen(false);
    setEditRow(null);
    setEditFormData({});
  };

  const invCols = [
    {title:'库位号', dataIndex:'binNo', width:110},
    {title:'目标库位', dataIndex:'targetBinNo', width:110, render:v=>v||'待分配'},
    {title:'型材唯一编码', dataIndex:'profileId', width:155, ellipsis:true},
    {title:'船号', dataIndex:'shipNo', width:100},
    {title:'分段号', dataIndex:'blockNo', width:100},
    {title:'程序号', dataIndex:'programNo', width:80},
    {title:'型材规格', dataIndex:'profileType', width:150},
    {title:'材质', dataIndex:'material', width:80},
    {title:'长度(mm)', dataIndex:'length', width:100},
    {title:'炉批号', dataIndex:'heatNumber', width:120},
    {title:'操作', key:'op', width:80, fixed:'right',
      render:(_,r)=>React.createElement(Button,{
        size:'small',type:'link',
        disabled:!canEditBin(r.binStatus),
        onClick:()=>openEditModal(r)
      },'修改')
    },
  ];

  return React.createElement('div', {className:'page-content'},
    React.createElement(Row, {gutter:12, className:'section-gap'},
      [
        {label:'总货位', val:stats.total, color:'#1677ff'},
        {label:'有货', val:stats.occupied, color:'#52c41a'},
        {label:'空货位', val:stats.empty, color:'#8c8c8c'},
        {label:'锁定', val:stats.locked, color:'#faad14'},
        {label:'异常', val:stats.abnormal, color:'#ff4d4f'},
        {label:'禁用', val:stats.disabled, color:'#595959'},
        {label:'使用率', val:`${(stats.inUse/stats.total*100).toFixed(1)}%`, color:'#722ed1'},
      ].map((s,i)=>
        React.createElement(Col,{key:i,xs:12,sm:8,md:8,lg:6,xl:4,xxl:3},
          React.createElement(Card,{size:'small',className:'stat-card',bodyStyle:{padding:'10px 12px'}},
            React.createElement(Statistic,{
              title:s.label, value:s.val,
              valueStyle:{color:s.color, fontSize:20, fontWeight:700}
            })
          )
        )
      )
    ),

    React.createElement(Card,{size:'small',className:'section-gap'},
      React.createElement(Form,{form, layout:'inline'},
        React.createElement(Form.Item,{name:'areaKey',label:'区域',style:{marginBottom:0}},
          React.createElement(Select,{placeholder:'全部',allowClear:true,style:{width:120}},
            AREA_CONFIGS.map(area=>React.createElement(Option,{key:area.key,value:area.key},area.name))
          )
        ),
        React.createElement(Form.Item,{name:'profileType',label:'规格',style:{marginBottom:0}},
          React.createElement(Select,{placeholder:'全部',allowClear:true,style:{width:160}},
            SPEC_LIST.map(v=>React.createElement(Option,{key:v,value:v},v))
          )
        ),
        React.createElement(Form.Item,{name:'material',label:'材质',style:{marginBottom:0}},
          React.createElement(Select,{placeholder:'全部',allowClear:true,style:{width:110}},
            MAT_LIST.map(v=>React.createElement(Option,{key:v,value:v},v))
          )
        ),
        React.createElement(Form.Item,{name:'shipNo',label:'船号',style:{marginBottom:0}},
          React.createElement(Select,{placeholder:'全部',allowClear:true,style:{width:120}},
            SHIP_LIST.map(v=>React.createElement(Option,{key:v,value:v},v))
          )
        ),
        React.createElement(Form.Item,{name:'blockNo',label:'分段号',style:{marginBottom:0}},
          React.createElement(Select,{placeholder:'全部',allowClear:true,style:{width:120}},
            BLOCK_LIST.map(v=>React.createElement(Option,{key:v,value:v},v))
          )
        ),
        React.createElement(Form.Item,{style:{marginBottom:0}},
          React.createElement(Space,null,
            React.createElement(Button,{type:'primary',onClick:handleSearch},'查询'),
            React.createElement(Button,{onClick:handleReset},'重置'),
          )
        ),
        React.createElement(Form.Item,{style:{marginBottom:0, marginLeft:'auto'}},
          React.createElement(Space,{size:10},
            React.createElement(Text,{type:'secondary',style:{fontSize:12}},'数据更新于 2026-05-17 14:32:15'),
            React.createElement(Button,{size:'small',type:'link',style:{padding:0}},'立即刷新'),
          )
        ),
      )
    ),

    React.createElement(Card,{
      size:'small',
      title:'货位看板',
      className:'section-gap',
      extra: React.createElement(Space,null,
        activeAreaKey && React.createElement(Tag,{color:'geekblue'},AREA_CONFIGS.find(item=>item.key===activeAreaKey)?.name),
        selected && React.createElement(Tag,{color:'blue',closable:true,onClose:()=>{setSelected(null);setTableData(filteredData);}},
          `已选中: ${selected.binNo}`
        ),
        React.createElement(Text,{type:'secondary',style:{fontSize:12}},
          '1号分区 95 库位 / 2号分区 136 库位 / 3号分区 136 库位'
        ),
      ),
    },
      React.createElement(WarehouseGrid,{data:visibleAreas, selected, onSelect:handleCellClick, matchBins})
    ),

    React.createElement(Card,{
      size:'small',
      title: React.createElement(Space,null,'库存明细',
        selected&&React.createElement(Tag,{color:'blue'},`库位: ${selected.binNo}`)
      ),
      extra: React.createElement(Space,null,
        React.createElement(Button,{size:'small'},'导出 Excel'),
        React.createElement(Button,{size:'small',type:'primary'},'批量导出'),
      ),
    },
      React.createElement(Table,{
        columns:invCols,
        dataSource:tableData,
        rowSelection:{type:'checkbox'},
        size:'small',
        scroll:{x:1210},
        pagination:{pageSize:8,showSizeChanger:true,showTotal:t=>`共 ${t} 条`},
      })
    ),

    React.createElement(Modal,{
      title: editRow?`修改库位 — ${editRow.binNo}`:'修改库位',
      open:editOpen, width:680,
      onOk:handleEditSave,
      onCancel:()=>{setEditOpen(false);setEditRow(null);setEditFormData({});},
      okText:'保存', cancelText:'取消',
      key:editRow?.binNo,
    },
      React.createElement(Alert,{
        type:'warning',showIcon:true,style:{marginBottom:14},
        message:'此操作将直接修改立库系统中该库位的型材绑定关系，请谨慎操作并填写修改原因。',
      }),
      React.createElement(Form,{layout:'vertical'},
        React.createElement(Row,{gutter:16},
          ...EDIT_FIELDS.map(([label,name])=>
            React.createElement(Col,{key:name,span:12},
              React.createElement(Form.Item,{label,name},
                React.createElement(Input,{
                  placeholder:`请输入${label}`,
                  defaultValue:editFormData[name]||'',
                  onChange:(e)=>setEditFormData({...editFormData,[name]:e.target.value})
                })
              )
            )
          ),
          React.createElement(Col,{span:24},
            React.createElement(Form.Item,{label:'修改原因',name:'reason',required:true},
              React.createElement(Input.TextArea,{
                rows:2,placeholder:'请填写本次修改的原因，便于追溯',
                defaultValue:editFormData.reason||'',
                onChange:(e)=>setEditFormData({...editFormData,reason:e.target.value})
              })
            )
          ),
        )
      )
    ),
  );
};

const InboundPage = ({data, planData, onNavigate}) => {
  const [open, setOpen] = useState(false);
  const [detailOpen, setDetailOpen] = useState(false);
  const [detailRow, setDetailRow] = useState(null);
  const [tasks, setTasks] = useState(data);
  const [taskEditRow, setTaskEditRow] = useState(null);
  const [taskEditFields, setTaskEditFields] = useState({});
  const {message:msg} = App.useApp();

  const canRevoke = (st) => ['WAIT','CHECK_FAILED'].includes(st);

  const [confirmRow, setConfirmRow] = useState(null);
  const [manualNote, setManualNote] = useState('');
  const [editFields, setEditFields] = useState({});
  const anomaly = tasks.find(t => t.status === 'CHECK_FAILED');
  const zoneAnomaly = tasks.find(t => t.status === 'ZONE_MATCH_FAILED');
  const [zoneFixRow, setZoneFixRow] = useState(null);
  const [manualZone, setManualZone] = useState();
  const openConfirm = (row) => {
    setEditFields({ profileUid:row.profileUid, shipNo:row.shipNo, blockNo:row.blockNo,
      programNo:row.programNo, profileType:row.profileType, material:row.material,
      length:row.length, heatNo:row.heatNo });
    setManualNote(row.manualNote || '');
    setConfirmRow(row);
  };
  const setF = (k, v) => setEditFields(prev => ({ ...prev, [k]: v }));
  const fld = (label, node) => React.createElement(Col, { span:12, style:{marginBottom:10} },
    React.createElement('div', { style:{fontSize:12,color:'#6b7280',marginBottom:4} }, label), node);
  const handleConfirm = () => {
    setTasks(prev => prev.map(t => t.key===confirmRow.key
      ? { ...t, ...editFields, status:'FINISHED', manualNote: manualNote.trim() || '已人工核对确认' } : t));
    msg.success(`型材 ${editFields.profileUid} 已人工确认，产线恢复`);
    setConfirmRow(null); setManualNote('');
  };

  const [adv, setAdv] = useState(null);
  const doDispatch = (r) => {
    if (r.zoneMatchStatus==='FAILED' || !r.zone) { msg.error('目标库区匹配异常，请先指定库区或重新排产'); return; }

            profileCount:p.profileCount||1, partsQty:p.partsQty||0, cutTime:p.cutTime||0, profiles:p.profiles||[],
            profileId:firstProfile.profileId||'P'+randId(), profileType:firstProfile.profileType||'未指定', shipNo:p.shipNo||'', blockNo:p.blockNo||'', packageNo:p.packageNo,
            profileGroups:[p], nestingLayoutNo:firstProfile.nestingLayoutNo||'-', programNo:firstProfile.programNo||'-', material:firstProfile.material||'-', length:firstProfile.length||0, source:'CREATE',
            outboundPort:'出库口1', createTime:new Date().toLocaleString('zh-CN'), finishTime:'',
            matReports:reports.matReports, partReports:reports.partReports, parts:[], status:'未叫料',
            pushLib:'未推送', pushSpray:'未推送', pushCut:'未推送', outlet:firstProfile.outlet||'E1', sprayStation:firstProfile.sprayStation||'S1', cutStation:firstProfile.cutStation||'C1',
            realtimeStock:1, uiState:'pending', editingField:null, pendingVal:null, conflictActual:null,
          };
        });
        return [...additions, ...prev];
      });
      msg.success(`已添加 ${orders.length} 个计划工单，状态为待出库`);
    };
    window.addEventListener('message', receiveOrders);
    window.addEventListener('central-control:add-processing-orders', receiveOrders);
    if (window.__PENDING_PROCESSING_ORDERS?.length) {
      const queued=window.__PENDING_PROCESSING_ORDERS;
      window.__PENDING_PROCESSING_ORDERS=[];

    return () => { window.removeEventListener('message', receiveOrders); window.removeEventListener('central-control:add-processing-orders', receiveOrders); };
  }, [msg]);

  // 按 id 局部更新（始终用函数式 setState，避免实时推送与异步回调互相覆盖）
  const patch = (id, fields) =>
    setItems(prev => prev.map(it => it.id === id ? { ...it, ...fields } : it));
  const patchMany = (ids, fields) =>
    setItems(prev => prev.map(it => ids.includes(it.id) ? { ...it, ...fields } : it));

  // ── 实时状态推送（模拟）：每 4.5s 随机推进一个 pending 物料的状态 ──
  useEffect(() => {
    const timer = setInterval(() => {
      if (!productionRunningRef.current) return;
      setItems(prev => {
        const pend = prev.filter(i => i.status !== '未叫料' && kbAllPushed(i));
        if (!pend.length) return prev;
        const target = kbRand(pend);
        const cfg = KB_LANES.find(l => l.id === target.lane);
        const idx = cfg.statuses.indexOf(target.status);
        if (idx >= 0 && idx < cfg.statuses.length - 1) {
          const ns = cfg.statuses[idx + 1];
          return prev.map(i => i.id === target.id ? {
            ...i, status: ns,
            // 实时工序推进只作用于当前队首型材，不能把一个组内多根型材同时推进到同一工序。
            profiles:(i.profiles||[]).map((profile,index)=>index===0 ? {...profile,status:ns} : {...profile,status:'排队中'}),
          } : i);
        }
        return prev;
      });
    }, 4500);
    return () => clearInterval(timer);
  }, []);

  const itemsRef = useRef(items); itemsRef.current = items;
  const patchBoth = (id, fields) => {
    setItems(prev => prev.map(it => it.id===id ? { ...it, ...fields } : it));
    setDetailRow(prev => (prev && prev.id===id) ? { ...prev, ...fields } : prev);
  };
  // 待下发→已下发的流转：仅当仍在待下发且三推送全部成功(或无需推送)时才切换状态
  const settleDispatch = (id) => {
    const flip = (x) => (x && x.id===id && (x.status==='未叫料'||x.status==='待出库') && kbPushOk(x.pushLib) && kbPushOk(x.pushSpray) && kbPushOk(x.pushCut)) ? { ...x, status:'已叫料' } : x;
    setItems(prev => prev.map(flip));
    setDetailRow(prev => flip(prev));
  };
  const PUSH_FAIL_RATE = 0.18;
  const needPush = (v) => v==='未推送' || v==='失败';   // 待(重)推
  // 顺序推送流水线：① 喷码 + 切割（加工文件）成功 → ② 立库（叫料/出库）；①失败则阻塞，不推立库
  const runPipeline = (id, done) => {
    const finish = (ok) => { if (done) done(ok); };
    if (!productionRunningRef.current) return finish(false);
    const phase2 = () => {
      if (!productionRunningRef.current) return finish(false);
      const c = itemsRef.current.find(x=>x.id===id);
      if (!c) return finish(false);
      if (!(kbPushOk(c.pushSpray) && kbPushOk(c.pushCut))) return finish(false);   // 喷码/切割未成功 → 阻塞
      if (c.pushLib==='无需推送' || !needPush(c.pushLib)) { settleDispatch(id); return finish(kbPushOk(c.pushLib)); }
      patchBoth(id, { pushLib:'推送中' });
      setTimeout(() => {
        if (!productionRunningRef.current) return finish(false);
        const pl = Math.random()<PUSH_FAIL_RATE ? '失败' : '成功';
        patchBoth(id, { pushLib:pl });
        settleDispatch(id);
        finish(pl==='成功');
      }, 1000 + Math.random()*700);
    };
    const c0 = itemsRef.current.find(x=>x.id===id);
    if (!c0) return finish(false);
    const p1 = [];
    if (c0.pushSpray!=='无需推送' && needPush(c0.pushSpray)) p1.push('pushSpray');
    if (c0.pushCut!=='无需推送'   && needPush(c0.pushCut))   p1.push('pushCut');
    if (!p1.length) { phase2(); return; }
    patchBoth(id, Object.fromEntries(p1.map(k=>[k,'推送中'])));
    setTimeout(() => {
      if (!productionRunningRef.current) return finish(false);
      // 喷码/切割为开始下发后的必达推送，不模拟失败
      const res = Object.fromEntries(p1.map(k=>[k, '成功']));
      patchBoth(id, res);
      if (p1.every(k=>res[k]==='成功')) {
        patchBoth(id, { status:'待出库' });
        msg.info(`${id} 喷码/切割完成，等待传感器信号后叫料`);
        setTimeout(() => { if (productionRunningRef.current) phase2(); else finish(false); }, 900);
      }
      else {
        // 喷码/切割失败 → 阻塞，不实际推立库；但立库置“失败”以提示整单受阻
        const lib = (itemsRef.current.find(x=>x.id===id)||{}).pushLib;
        if (lib !== '无需推送') patchBoth(id, { pushLib:'失败' });
        finish(false);
      }
    }, 1000 + Math.random()*700);
  };
  const pushSettle = (id) => runPipeline(id, null);
  // 重新推送（仅在详情触发）：重推该上位机成功后，按顺序继续后续推送并尝试流转
  const repushTarget = (item, pushKey, name) => {
    patchBoth(item.id, { [pushKey]:'推送中' });
    setTimeout(() => {
      patchBoth(item.id, { [pushKey]:'成功' });
      msg.success(`${item.id} 已重新推送至${name}`);
      runPipeline(item.id, null);   // 喷码/切割补齐后自动推立库，全部成功则流转
    }, 1000);
  };
  // 修改工位：未下发直接改（重置对应推送为未推送）；已下发为强制修改，需弹窗确认产线停止，改后重推对应上位机
  //   改出库口→重推喷码；改切割工位→重推切割
  const doChange = (item, field, next) => {

        outboundPort:Math.random()>0.5?'出库口1':'出库口2', createTime:new Date().toLocaleString('zh-CN'), finishTime:'',
        matReports:reports.matReports, partReports:reports.partReports, parts,
        status:'未叫料', pushLib:enab(v.pushLibEnable), pushSpray:enab(v.pushSprayEnable), pushCut:enab(v.pushCutEnable),

    setNewOrderOpen(false); setNewOrderKeys([]); setNewOrderPkgFilter(''); orderForm.resetFields();
  });

  const doRecall = (item) => {

      Modal.confirm({
        title:'撤回加工任务', content:`确认撤回任务 ${item.taskNo}？撤回后将回到排产任务，并跳转至“预排产”页面。`,
        okText:'确认撤回', cancelText:'取消',
        onOk:()=>{

        },
      });
      return;
    }
    if (Math.random() < 0.75) {
      const keep = (v) => v === '无需推送' ? '无需推送' : '未推送';
      patch(item.id, { status: '未叫料', pushLib:keep(item.pushLib), pushSpray:keep(item.pushSpray), pushCut:keep(item.pushCut) });

  };

    if (!groupItems.length) return;
    Modal.confirm({
      title:'撤回切割工单', content:`确认撤回切割工单 ${group.groupNo} 的 ${groupItems.length} 个加工任务？`,
      okText:'确认撤回', cancelText:'取消',
      onOk:()=>{
        setItems(prev=>prev.filter(item=>!groupItems.some(target=>target.id===item.id)));
        groupItems.forEach(item=>onRecallToSchedule?.(item));
        msg.success(`切割工单 ${group.groupNo} 已撤回至排产任务`);
      }
    });
  };
  const recallProfiles = (group, profileKeys) => {

    );

      title:'撤回型材', content:`确认撤回已选 ${chosen.length} 根型材？`, okText:'确认撤回', cancelText:'取消',
      onOk:()=>{
        const idsByTask=new Map();
        chosen.forEach(({profile,task})=>{

    });
  };

    if (!recalled.length) { msg.info(`${station} 没有可撤回的待处理切割工单`); return; }
    setItems(prev=>prev.filter(item=>!recalled.some(target=>target.id===item.id)));
    recalled.forEach(item=>onRecallToSchedule?.(item,{stayOnPage:true}));
    msg.success(`${station} 已禁用，${recalled.length} 个切割工单已撤回至排产任务`);
  };
  const doDispatch = (item) => {
    pushSettle(item.id);
    msg.success(`${item.id} 下发中…，等待推送返回后流转`);
  };

  // 切换零件的分拣托盘（同步更新表格数据与打开中的详情）
  const changePartPallet = (item, part, pallet) => {
    const apply = (it) => ({ ...it, parts: it.parts.map(p => p.key===part.key ? { ...p, sortPallet:pallet } : p) });
    const doApply = () => {
      setItems(prev => prev.map(it => it.id===item.id ? apply(it) : it));
      setDetailRow(prev => (prev && prev.id===item.id) ? apply(prev) : prev);
      msg.success(`零件 ${part.partId} 分拣托盘 → ${pallet}（强制修改），正在重新推送切割`);
    };

    Modal.confirm({ title:'请确认产线停止',
      content:`修改分拣托盘为 ${pallet} 将影响在产产线，请确认产线已停止后继续。`,
      okText:'已停止，确认修改', cancelText:'取消', onOk: doApply });
  };

  // 批量撤回：仅对所选中状态为「已叫料」的物料生效
  const doBatchRecall = () => {
    const targets = items.filter(i => selectedRowKeys.includes(i.id) && i.status === '已叫料');
    if (!targets.length) { msg.info('所选中没有「已叫料」可撤回的物料'); return; }
    const okIds = targets.filter(() => Math.random() < 0.75).map(t => t.id);

    const failN = targets.length - okIds.length;

    setSelectedRowKeys(prev => prev.filter(k => !okIds.includes(k)));
  };

  // 批量修改工位：未叫料直接改(重置对应推送)；已下发需确认产线停止并重推对应上位机
  const doBatchChangeNext = (field, station) => {

    const di = KB_STATION_MAP[field].di, pk = KB_STATION_MAP[field].pk, pkLabel = KB_STATION_MAP[field].label;
    const selectedGroups = new Set(items.filter(i=>selectedRowKeys.includes(i.id)).map(profileGroupKey));
    // 切割机是切割工单级排产资源：选择组内任一任务时，同组未完成任务一起调整。
    const targets = items.filter(i => i.status !== '分拣完成' && (

    ));
    if (!targets.length) { msg.info('未选择可修改的工单'); return; }
    const applyBatch = () => {
      patchMany(targets.map(t => t.id), { [di]: station });
      targets.forEach(t => {
        if (t.status === '未叫料') { if (t[pk] !== '无需推送') patch(t.id, { [pk]: '未推送' }); }
        else { repushTarget(t, pk, pkLabel); }
      });
      const unitText = field === 'cut' ? `${new Set(targets.map(profileGroupKey)).size} 个切割工单 / ${targets.length} 项` : `${targets.length} 项`;
      msg.success(`已批量修改 ${unitText} ${meta.label} → ${station}`);

        okText: '已停止，确认修改', cancelText: '取消', onOk: applyBatch,

  // ── 工位单元格（由排产指定，只读展示）──
  const renderStation = (item, field) => {

      }

      ...group, ...profile,

const SCHED_PLAN_STATUS = {
  READY:      { label:'待下发', color:'default' },
  DISPATCHED: { label:'已下发', color:'success' },
};
const SCHED_PLAN_SOURCE = {
  CREATE: { label:'创建', color:'blue' },
  REVOKE: { label:'撤回', color:'orange' },

const SCHED_PRODUCTION_STATUS = {
  PENDING:    { label:'待生产', color:'default' },
  PROCESSING: { label:'生产中', color:'processing' },
  COMPLETED:  { label:'生产完成', color:'success' },
};
const SCHED_PLAN_DAO_LIST = ['H1','H2','H3','M1','M2','G1','R1','C1'];
const makeSchedPlanList = (n=8) => {
  const machines = ['C1','C2','C3'];
  const shifts = ['白班','夜班','白班+夜班'];
  const today = new Date();
  return Array.from({length:n}, (_,i) => {
    const pkgCount = rnd(4)+2;
    const d = new Date(today.getTime() + (i-2)*86400000);
    const ds = `${d.getFullYear()}-${padZ(d.getMonth()+1,2)}-${padZ(d.getDate(),2)}`;
    const usedMachines = machines.slice(0, rnd(2)+1);
    const packages = Array.from({length:pkgCount}, (_,pi) => {
      const profCnt = rnd(6)+6;
      const shipNo = pick(SHIP_LIST);
      const blockNo = pick(BLOCK_LIST);
      const packageNo = `PKG-${padZ(i+1,2)}${padZ(pi+1,2)}-${padZ(rnd(99)+1,2)}`;
      const machine = pick(usedMachines);
      const missingCount = Math.random()<0.42 ? rnd(3)+1 : 0;
      const stockReady = Math.max(0, profCnt - missingCount);
      const profiles = Array.from({length:profCnt}, (_,pj) => ({
        key: pj+1,
        profileId: 'P'+randId(),
        nestingLayoutNo: `NEST-${padZ(i+1,3)}-${padZ(pi+1,2)}-${padZ(pj+1,2)}`,
        profileType: pick(SPEC_LIST),
        length: (rnd(8)+2)*1000,
        weight: +(Math.random()*800+120).toFixed(0),
        daoCi: pick(SCHED_PLAN_DAO_LIST),
        outlet: pick(['E1','E2']),
        partsQty: rnd(20)+3,
        cutTime: rnd(240)+60,
        planningStatus: pick(['NOT_STARTED','PROCESSING','PROCESS_DONE_WAIT_PLAN','PLANNING','PLAN_DONE_WAIT_MIGRATE','MIGRATING','MIGRATED','MIGRATED']),
        stockStatus: pj < stockReady ? 'READY' : 'SHORTAGE',
        profileGroupId: `PG-${padZ(i+1,3)}-${padZ(pi+1,2)}-${padZ(Math.floor(pj/3)+1,2)}`,
        profileGroupNo: `切割工单-${padZ(i+1,3)}-${padZ(pi+1,2)}-${padZ(Math.floor(pj/3)+1,2)}`,
        profileGroupName: `${packageNo}-G${padZ(Math.floor(pj/3)+1,2)}`,
      }));
      const profileGroups = Object.values(profiles.reduce((groups, profile) => {
        const id = profile.profileGroupId;
        if (!groups[id]) groups[id] = {
          key:id, profileGroupId:id, profileGroupNo:profile.profileGroupNo, profileGroupName:profile.profileGroupName,
          sourceOrderId:packageNo, sourceOrderNo:packageNo, shipNo, blockNo, machine,
          prodDate:ds,
          groupOrder:Object.keys(groups).length+1, profileCount:0, partsQty:0, cutTime:0, stockReady:0,
          source:'创建', scheduleStatus:'已排产', dispatchStatus:'未下发', processStatus:'待出库', activeStatus:'生效', profiles:[],
        };
        const group = groups[id];
        group.profileCount += 1;
        group.partsQty += profile.partsQty;
        group.cutTime += profile.cutTime;
        group.stockReady += profile.stockStatus==='READY' ? 1 : 0;
        group.profiles.push(profile);
        group.planProgress = {
          done: group.profiles.filter(item=>item.planningStatus==='MIGRATED').length,
          total: group.profiles.length,
        };
        return groups;
      }, {}));
      return {
        key: `${i+1}-${pi+1}`,
        packageNo,
        shipNo, blockNo, machine,
        profileCount: profCnt, stockReady,
        taskDispatched: false,
        profileGroups,
        profiles,
      };
    });
    const profileCount = packages.reduce((s,p)=>s+p.profileCount, 0);
    const groupCount = packages.reduce((s,p)=>s+p.profileGroups.length, 0);
    const partsQty = packages.reduce((s,p)=>s+p.profileGroups.reduce((n,g)=>n+g.partsQty,0),0);
    // 示例数据循环覆盖三种入库状态：未开始、未完成、已完成。
    const inboundStage = i % 3;
    const stockReady = inboundStage===0 ? 0 : (inboundStage===1 ? Math.max(1, profileCount-2) : profileCount);
    let remainingCompleted = stockReady;
    packages.forEach(pkg => {
      pkg.stockReady = Math.min(pkg.profileCount, remainingCompleted);
      remainingCompleted -= pkg.stockReady;
      pkg.profiles.forEach((profile, index) => {
        profile.stockStatus = index < pkg.stockReady ? 'READY' : 'SHORTAGE';
      });
      pkg.profileGroups.forEach(group => {
        group.stockReady = group.profiles.filter(profile=>profile.stockStatus==='READY').length;
      });
    });
    const totalHours = +(profileCount*3.2/60).toFixed(1);
    const historyPackages = packages.map(pkg => ({
      ...pkg,
      profileGroups: pkg.profileGroups.filter((group,index) => index === 0 || (index + i) % 3 !== 0),
    }));
    const historyGroups = historyPackages.flatMap(pkg=>pkg.profileGroups);
    const historyProfileCount = historyGroups.reduce((sum,group)=>sum+group.profileCount,0);
    const historyPartsQty = historyGroups.reduce((sum,group)=>sum+group.partsQty,0);
    const historyStockReady = historyGroups.reduce((sum,group)=>sum+group.stockReady,0);
    const historyGroupCount = historyGroups.length;
    return {
      key: i+1,
      schedNo: `SCH-${d.getFullYear()}${padZ(d.getMonth()+1,2)}${padZ(d.getDate(),2)}-${padZ(i+1,2)}`,
      pkgCount, groupCount, profileCount, partsQty, stockReady,
      source: i % 4 === 3 ? 'REVOKE' : 'CREATE',
      createdAt: `${ds} ${padZ(8+(i%6),2)}:${padZ(12+i*7,2)}:${padZ(10+i*3,2)}`,
      planId:`PLAN-${d.getFullYear()}${padZ(d.getMonth()+1,2)}-${padZ(i+1,3)}`,
      versionNo:'V2.0', versionStatus:'已确认',
      machines: usedMachines, shift: pick(shifts),
      totalHours,
      status: i < 3 ? 'DISPATCHED' : 'READY',
      productionStatus: i===0 ? 'COMPLETED' : (i===1 ? 'PROCESSING' : 'PENDING'),
      dispatchTime: i < 3 ? `${ds} ${padZ(8+i,2)}:${padZ(20+i*7,2)}:${padZ(10+i*3,2)}` : '',
      packages,
      versionHistory:[{
        versionNo:'V1.0',
        createdAt:`${ds} 07:${padZ(18+i*4,2)}:00`,
        source:'CREATE',
        groupCount:historyGroupCount,
        profileCount:historyProfileCount,
        partsQty:historyPartsQty,
        stockReady:historyStockReady,
        totalHours:+(historyProfileCount*3.2/60).toFixed(1),
        packages:historyPackages,
        machines:usedMachines,
        status:'READY',
        shift:pick(shifts),
      }],
    };
  });
};

const PLAN_SOURCES = { MES:{label:'MES下发',color:'blue'}, LOCAL:{label:'创建',color:'green'} };
const normalizeProdDate = (value) => {
  const text = String(value || '').trim();
  if (!text) return '';
  const match = text.match(/\d{4}-\d{2}-\d{2}/);
  return match ? match[0] : text;
};
const randomPlanDate = () => `2026-08-${padZ(rnd(28)+1)}`;
const PLAN_PROD_DATE_STORAGE_KEY = 'profile_plan_prod_dates';
const loadPlanProdDateStore = () => {
  try {
    return JSON.parse(localStorage.getItem(PLAN_PROD_DATE_STORAGE_KEY) || '{}') || {};
  } catch (e) {
    return {};
  }
};
const savePlanProdDateStore = (items) => {
  const store = {};
  (items || []).forEach(item => {
    const ds = normalizeProdDate(item.prodShift);
    if (ds) store[item.packageNo] = ds;
  });
  localStorage.setItem(PLAN_PROD_DATE_STORAGE_KEY, JSON.stringify(store));
};
const applyPlanProdDateStore = (items) => {
  const store = loadPlanProdDateStore();
  return (items || []).map(item => ({
    ...item,
    prodShift: Object.prototype.hasOwnProperty.call(store, item.packageNo)
      ? store[item.packageNo]
      : normalizeProdDate(item.prodShift),
  }));
};
// 型材工艺规划生命周期：工艺 → 规划 → 迁移。旧数据在首次加载时转换为对应的新状态。
const PROFILE_PLAN_STATUS = {
  NOT_STARTED:               {label:'未开始',               done:0},
  PROCESSING:                {label:'工艺中',               done:0, active:0, activeClass:'kb-prog-cur'},
  PROCESS_DONE_WAIT_PLAN:    {label:'工艺完成，等待规划',   done:1},
  PLANNING:                  {label:'规划中',               done:1, active:1, activeClass:'kb-prog-cur kb-prog-cur-plan'},
  PLAN_DONE_WAIT_MIGRATE:    {label:'规划完成，等待迁移',   done:2},
  MIGRATING:                 {label:'迁移中',               done:2, active:2, activeClass:'kb-prog-cur kb-prog-cur-migrate'},
  PROCESS_FAILED:            {label:'工艺失败',             done:0, failed:0},
  PLAN_FAILED:               {label:'规划失败',             done:1, failed:1},
  MIGRATE_FAILED:            {label:'迁移失败',             done:2, failed:2},
  MIGRATED:                  {label:'完成',                 done:3},
};
// 历史演示数据只有 PLANNED；首次进入计划列表时随机展开为不同的正常生命周期节点，
// 便于直观看到工单汇总与三段进度条的各种回显。
const LEGACY_PLANNED_SAMPLE_STATUSES = [
  'PROCESSING','PROCESS_DONE_WAIT_PLAN','PLANNING',
  'PLAN_DONE_WAIT_MIGRATE','MIGRATING','MIGRATED',
];
const normalizeProfilePlanningStatus = (status) => ({
  PLANNED:pick(LEGACY_PLANNED_SAMPLE_STATUSES),
  ABNORMAL:'PLAN_FAILED',
}[status] || (PROFILE_PLAN_STATUS[status] ? status : 'NOT_STARTED'));
const getProfilePlanStatus = status => PROFILE_PLAN_STATUS[normalizeProfilePlanningStatus(status)];
const calcPlanProgress = (items) => {
  const total = items.length;
  const done = items.filter(item => normalizeProfilePlanningStatus(item.planningStatus) === 'MIGRATED').length;
  return {done, total};
};
const renderPlanProgress = (progress) => {
  const complete = progress.total > 0 && progress.done === progress.total;
  return React.createElement(Tag, {color:complete ? 'success' : 'warning', style:{margin:0}},
    `${complete ? '完成' : '未完成'} ${progress.done}/${progress.total}`);
};
const buildPlanAllPackages = (items) => {
  const map = new Map();
  (items || []).forEach(item => {
    if (!map.has(item.packageNo)) {
      map.set(item.packageNo, {
        packageNo: item.packageNo,
        shipNo: item.shipNo,
        blockNo: item.blockNo,
        scheduleDate: item.scheduleDate || '',
        prodShift: normalizeProdDate(item.prodShift),
        source: item.source,
        profileCount: 0,
        stockReady: 0,
        cutTime: 0,
        profiles: [],
      });
    }
    const pkg = map.get(item.packageNo);
    pkg.profileCount += 1;
    if (item.inStock) pkg.stockReady += 1;
    pkg.cutTime += Number(item.cutTime || 0);
    pkg.profiles.push({
      key:item.key,
      profileId:item.profileId,
      nestingLayoutNo:item.nestingLayoutNo,
      profileType:item.profileType,
      material:item.material,
      length:item.length,
      partsQty:item.partsQty,
      cutTime:Number(item.cutTime || 0),
      prodShift:normalizeProdDate(item.prodShift),
      inStock:!!item.inStock,
    });
    if (item.scheduleDate) pkg.scheduleDate = item.scheduleDate;
    const nd = normalizeProdDate(item.prodShift);
    if (nd) pkg.prodShift = nd;
  });
  return Array.from(map.values())
    .map(pkg => ({...pkg, planProgress:calcPlanProgress((items || []).filter(item => item.packageNo === pkg.packageNo))}))
    .sort((a,b)=>a.packageNo.localeCompare(b.packageNo));
};
const buildPlanProdDateMap = (items) => {
  const grouped = {};
  (items || []).forEach(item => {
    const ds = normalizeProdDate(item.prodShift);
    if (!ds) return;
    const packageNo = item.packageNo;
    if (!grouped[ds]) grouped[ds] = {};
    if (!grouped[ds][packageNo]) {
      grouped[ds][packageNo] = {
        packageNo,
        shipNo:item.shipNo,
        blockNo:item.blockNo,
        programNo:item.programNo,
        source:item.source,
        prodShift:ds,
        materialCount:0,
        cutTime:0,
      };
    }
    grouped[ds][packageNo].materialCount += 1;
    grouped[ds][packageNo].cutTime += Number(item.cutTime || 0);
  });
  Object.keys(grouped).forEach(ds => { grouped[ds] = Object.values(grouped[ds]); });
  return grouped;
};
const renderDetailPlanningStatus = (status) => {
  const cfg = getProfilePlanStatus(status);
  const steps = ['工艺','规划','迁移'];
  return React.createElement(Tooltip,{title:cfg.label},
    React.createElement('div',{className:'kb-prog plan-prog'},

          key:step, title:step,
          className:'kb-prog-seg '+(
            index === cfg.failed ? 'kb-prog-failed' :

          ),
        }))
      ),
      React.createElement('span',{className:'kb-prog-label'},`${cfg.done}/3 ${cfg.label}`)
    )
  );
};

const downloadText = (filename, content, mime) => {
  const blob = new Blob(['﻿'+content], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
};

const LOG_TYPES = ['操作日志','事件日志','性能日志','接口日志'];
const LOG_LEVELS = { DEBUG:'default', INFO:'blue', WARN:'gold', ERROR:'red', FATAL:'magenta' };
const LOG_SAMPLES = {
  '操作日志':['用户登录系统','修改用户信息','撤回入库任务','批量设置计划日期','启用班次 双班16h'],

};
const makeLogs = (n=60) => Array.from({length:n},(_,i)=>{

  return { key:i+1, log_id:9000+i, type, level:lv, content:pick(LOG_SAMPLES[type]),
    source:type==='接口日志'?pick(['WMS','喷码上位机','切割上位机','PLC']):`操作员${rnd(9)+1}`,
    time:`2026-06-0${1+(i%9)} ${padZ(8+(i%12))}:${padZ((i*7)%60)}:${padZ((i*13)%60)}` };
});
const LogPage = () => {
  const { message:msg } = App.useApp();
  const [list, setList] = useState(makeLogs);

    if (!filtered.length) { msg.warning('当前无日志可导出'); return; }
    const head = ['时间','类型','等级','内容','来源'];
    if (fmt==='txt') {

      downloadText('日志导出.txt', txt);

          React.createElement(Button,{danger:true,size:'small'},`手动删除(${sel.length})`)),

  const renderPage = () => {
    switch(page) {
      case 'dashboard':   return React.createElement(InventoryDashboard,  {gridData, inventoryData});
      case 'inbound':     return React.createElement(InboundPage,         {data:inboundData,planData,onNavigate:setPage});
      case 'outbound':    return React.createElement(OutboundPage, {data:outboundData, matReports:matReportData, partsReports:partsReportData, onRecallToSchedule:recallToSchedule});
      case 'bin-maint':   return React.createElement(BinMaintenancePage,  {data:binMaintData});
      case 'plan':        return React.createElement(PlanPage,            {data:planData, onNavigate:setPage, onScheduleTargetDate:setSchedTargetDate});
      case 'sched-list':  return React.createElement(SchedulePage,        {targetDate:schedTargetDate,dispatchConfirm,onConfirmDispatch:confirmDispatch,onCancelDispatch:()=>{setDispatchConfirm(null);setPage('sched-plan-list');},disableCreateOrder:true});
      case 'sched-plan-list': return React.createElement(SchedPlanListPage, {onNavigate:navigate,onOpenDispatchConfirm:openDispatchConfirm});
      case 'new-sched-plan':  return React.createElement(SchedulePage, {targetDate:schedTargetDate});
      case 'mat-report':  return React.createElement(MaterialReportPage,  {data:matReportData});
      case 'parts-report':return React.createElement(PartsReportPage,     {data:partsReportData});
      case 'user-mgmt':   return React.createElement(UserPage,            {});
      case 'role-mgmt':   return React.createElement(RolePage,            {});
      case 'shift-mgmt':  return React.createElement(ShiftPage,           {});
      case 'log-mgmt':    return React.createElement(LogPage,             {});
      default: return React.createElement('div',{style:{padding:24}},'页面建设中…');
    }
  };

  // 独立页面模式：只渲染指定业务页，不显示主系统侧栏和页头。
  if (embeddedPage) return React.createElement('div', {style:{height:'100vh',overflow:'auto',background:'#f5f6fa'}}, renderPage());

  return React.createElement(Layout,{style:{height:'100vh'}},
    // Sider
    React.createElement(Sider,{
      collapsible:true, collapsed, onCollapse:setCollapsed,
      theme:'light', width:196, collapsedWidth:58,
      style:{boxShadow:'2px 0 8px rgba(0,0,0,.06)'},
    },
      // Logo
      React.createElement('div',{className:'sider-logo'},
        React.createElement('img',{ src:'logo范围.png', alt:'型材立库中控管理系统',
          style:{ height: collapsed?34:44, width:'auto', maxWidth:'100%', objectFit:'contain' } })
      ),
      React.createElement(Menu,{
        theme:'light', mode:'inline',
        selectedKeys:[page==='new-sched-plan' ? 'sched-plan-list' : page],
        defaultOpenKeys: NAV_ITEMS.map(g=>g.key),
        items: collapsed ? NAV_ITEMS.flatMap(g=>g.children) : NAV_ITEMS,
        onClick:({key})=>setPage(key),
        style:{borderInlineEnd:'none', paddingTop:4, height:'calc(100vh - 104px)', overflowY:'auto', overflowX:'hidden'},
      })
    ),

    // Right side
    React.createElement(Layout,null,
      // Header
      React.createElement('div',{className:'header-bar'},
        React.createElement(Breadcrumb,{
          items: page==='new-sched-plan'
            ? [
                {title:React.createElement(Text,{style:{color:'#E85B00',fontWeight:600}},'中控系统')},
                {title:'排产列表'},
                {title:'新建排产'},
              ]
            : [
                {title:React.createElement(Text,{style:{color:'#E85B00',fontWeight:600}},'中控系统')},
                {title:PAGE_NAMES[page]||page}
              ]
        }),
        React.createElement(Space,{split:React.createElement(Divider,{type:'vertical'})},
          React.createElement('span',null,
            React.createElement('span',{className:'conn-dot conn-ok'}),
            React.createElement(Text,{style:{fontSize:12}},'WMS 在线')
          ),
          React.createElement('span',null,
            React.createElement('span',{className:'conn-dot conn-ok'}),
            React.createElement(Text,{style:{fontSize:12}},'MES 在线')
          ),
          React.createElement('span',null,
            React.createElement('span',{className:'conn-dot conn-ok'}),
            React.createElement(Text,{style:{fontSize:12}},'喷码 在线')
          ),
          React.createElement('span',null,
            React.createElement('span',{className:'conn-dot conn-ok'}),
            React.createElement(Text,{style:{fontSize:12}},'切割1 在线')
          ),
          React.createElement('span',null,
            React.createElement('span',{className:'conn-dot conn-ok'}),
            React.createElement(Text,{style:{fontSize:12}},'切割2 在线')
          ),
          React.createElement('span',null,
            React.createElement('span',{className:'conn-dot conn-ok'}),
            React.createElement(Text,{style:{fontSize:12}},'切割3 在线')
          ),
          React.createElement(Text,{type:'secondary',style:{fontSize:12}},
            '仓管管理员 ｜ 2026-05-17'
          ),
        )
      ),

      // Content
      React.createElement(Content,{style:{overflow:'auto',background:'#f5f6fa'}},
        renderPage()
      ),
    )
  );
};

// Root
const RootApp = () =>
  React.createElement(ConfigProvider,{
    theme:{
      token:{
        colorPrimary:'#E85B00',
        colorLink:'#E85B00',
        borderRadius:6,
        colorBgContainer:'#ffffff',
      }
    }
  },
    React.createElement(App,null,
      React.createElement(AppInner,null)
    )
  );

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(RootApp));
</script>
</body>
</html>
