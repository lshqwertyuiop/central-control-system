  h(Select,{key:'ov',value:vals.outlet,onChange:v=>setVals(x=>({...x,outlet:v})),options:['E1','E2'].map(v=>({value:v,label:v}))}),
  h('span',{key:'sl'},U.spray),
  h(Select,{key:'sv',value:vals.spray,onChange:v=>setVals(x=>({...x,spray:v})),options:['P1','P2'].map(v=>({value:v,label:v}))}),
  h('span',{key:'cl'},U.cut),
  h(Select,{key:'cv',value:vals.cut,onChange:v=>setVals(x=>({...x,cut:v})),options:['C1','C2','C3'].map(v=>({value:v,label:v+' - '+(machines[v]?U.available:U.disable),disabled:!machines[v]}))})
 ];
 if(mismatch)fields.push(
  h('span',{key:'ws'}),
  h(Alert,{key:'wa',type:'warning',showIcon:true,message:'\u5f53\u524d\u7269\u6599\u5728 '+edit.zone+' \u5e93\u533a\uff0c\u4e0d\u5c5e\u4e8e '+vals.outlet+' \u5bf9\u5e94\u5e93\u533a',description:'\u9009\u62e9\u5148\u79fb\u5e93\u540e\u53ef\u7ee7\u7eed\uff0c\u9884\u8ba1\u51fa\u5e93\u65f6\u95f4\u589e\u52a0 12 \u5206\u949f'}),
  h('span',{key:'cs'}),
  h(Checkbox,{key:'cb',checked:vals.moveFirst,onChange:e=>setVals(x=>({...x,moveFirst:e.target.checked}))},U.move+'\uff08\u51fa\u5e93 +12 \u5206\u949f\uff09')
 );
 return h(Modal,{open:true,title:U.change+' \u00b7 '+edit.layout,onCancel,onOk,okText:U.repush,cancelText:'\u53d6\u6d88',width:620},
  h(Alert,{type:'info',showIcon:true,message:'\u5df2\u4e0b\u53d1\u4efb\u52a1\u5728\u6b64\u4fee\u6539\uff0c\u4fdd\u5b58\u540e\u81ea\u52a8\u91cd\u65b0\u63a8\u9001\u7acb\u5e93 / \u55b7\u7801 / \u5207\u5272',style:{marginBottom:16}}),
  h('div',{style:{display:'grid',gridTemplateColumns:'120px 1fr',gap:12,alignItems:'center'}},fields)
 );
}
function AllocationBoard({tasks,setTasks,machines,toggleMachine,msg}){
 const remain=tasks.filter(x=>['queued','shortage','sending'].includes(x.status));
 const cutMinutes=t=>Math.ceil(t.length/1000*2+4);
 const assign=(id,cut)=>{if(!machines[cut])return msg.warning(cut+' \u5df2\u7981\u7528\uff0c\u4e0d\u80fd\u63a5\u6536\u4efb\u52a1');setTasks(v=>v.map(x=>x.id===id?{...x,cut}:x));msg.success('\u5df2\u5c06\u4efb\u52a1\u8c03\u6574\u5230 '+cut+'\uff0c\u5f85\u91cd\u65b0\u63a8\u9001')};
 const columns=['C1','C2','C3'].map(c=>{
  const cutTasks=remain.filter(x=>x.cut===c);
  const totalMinutes=cutTasks.reduce((sum,t)=>sum+cutMinutes(t),0);
  const cards=cutTasks.map(t=>h('div',{className:'resched-item',key:t.id,draggable:true,onDragStart:e=>e.dataTransfer.setData('id',t.id)},
   h('div',{className:'mono'},t.layout),
   h('div',{className:'cell-sub'},t.spec+' \u00b7 '+t.outlet+' \u00b7 '+(t.stock?U.stock:U.shortage)),
   h('div',{className:'duration'},'\u9884\u8ba1\u5207\u5272 '+cutMinutes(t)+' \u5206\u949f')
  ));
  return h('div',{className:'resched-col '+(machines[c]?'':'disabled'),key:c,onDragOver:e=>e.preventDefault(),onDrop:e=>assign(Number(e.dataTransfer.getData('id')),c)},
   h('div',{className:'resched-head'},h('span',null,c+' \u5207\u5272\u961f\u5217'),h(Space,{size:6},h(Tag,{color:'blue'},totalMinutes+' \u5206\u949f'),h(Switch,{size:'small',checked:machines[c],checkedChildren:U.available,unCheckedChildren:U.disable,onChange:v=>toggleMachine(c,v)}))),
   cards
  );
 });
 return h('section',{className:'allocation-panel'},
  h('div',{className:'allocation-head'},
   h('div',null,h('div',{className:'allocation-title'},'\u5207\u5272\u673a\u961f\u5217'),h('div',{className:'allocation-note'},'\u6309 C1 / C2 / C3 \u7edf\u8ba1\u672a\u4e0b\u53d1\u4efb\u52a1\u7684\u9884\u8ba1\u5207\u5272\u65f6\u957f\uff0c\u53ef\u62d6\u62fd\u8c03\u6574\u673a\u5668')),
   h(Tag,{color:'blue'},remain.length+' \u6839\u5f85\u5206\u914d')
  ),
  h('div',{className:'resched-board'},columns)
 );
}
const Root=()=>h(ConfigProvider,{theme:{token:{colorPrimary:'#E85B00',colorLink:'#E85B00',borderRadius:6,colorBgContainer:'#ffffff'}}},h(App,null,h(Main)));
ReactDOM.createRoot(document.getElementById('root')).render(h(Root));
</script></body></html>
